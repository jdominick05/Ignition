<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Ignition: real-time YOLO on the Ryzen AI NPU">
  <!-- The mark is the NPU's 4x4 core array lit as a flame: brightest at the base, fading upward. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a0a"/>
      <stop offset="1" stop-color="#1a1210"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ed1c24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#ff7a2a"/>
      <stop offset="1" stop-color="#ed1c24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff7a2a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ed1c24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)"/>
  <ellipse cx="200" cy="190" rx="220" ry="170" fill="url(#halo)"/>

  <!-- flame silhouette behind the array -->
  <path d="M200 40 C 240 95, 300 120, 290 200 C 284 255, 245 290, 200 292 C 155 290, 116 255, 110 200 C 104 140, 150 120, 168 82 C 176 110, 190 118, 200 40 Z"
        fill="#ff7a2a" fill-opacity="0.10"/>

  <!-- 4 x 4 cores, brightness rising toward the base like a flame (decoration, not data) -->
  <g filter="url(#glow)">
    <rect x="186" y="78"  width="28" height="28" rx="5" fill="url(#hot)" fill-opacity="0.55"/>
    <rect x="144" y="120" width="34" height="34" rx="6" fill="url(#hot)" fill-opacity="0.45"/>
    <rect x="183" y="114" width="34" height="34" rx="6" fill="url(#hot)" fill-opacity="0.8"/>
    <rect x="222" y="120" width="34" height="34" rx="6" fill="url(#hot)" fill-opacity="0.5"/>
    <rect x="124" y="166" width="36" height="36" rx="6" fill="url(#hot)" fill-opacity="0.6"/>
    <rect x="164" y="162" width="36" height="36" rx="6" fill="url(#hot)"/>
    <rect x="204" y="162" width="36" height="36" rx="6" fill="url(#hot)" fill-opacity="0.9"/>
    <rect x="244" y="166" width="36" height="36" rx="6" fill="url(#hot)" fill-opacity="0.65"/>
    <rect x="124" y="208" width="36" height="36" rx="6" fill="url(#hot)" fill-opacity="0.85"/>
    <rect x="164" y="206" width="36" height="36" rx="6" fill="url(#hot)"/>
    <rect x="204" y="206" width="36" height="36" rx="6" fill="url(#hot)"/>
    <rect x="244" y="208" width="36" height="36" rx="6" fill="url(#hot)" fill-opacity="0.8"/>
    <rect x="134" y="250" width="34" height="30" rx="6" fill="url(#hot)"/>
    <rect x="172" y="250" width="28" height="30" rx="6" fill="url(#hot)"/>
    <rect x="204" y="250" width="28" height="30" rx="6" fill="url(#hot)"/>
    <rect x="236" y="250" width="34" height="30" rx="6" fill="url(#hot)"/>
  </g>

  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace">
    <text x="400" y="158" font-size="84" font-weight="700" fill="url(#word)">Ignition</text>
    <text x="404" y="208" font-size="25" fill="#ece3dc">Real-time YOLO on the Ryzen™ AI NPU.</text>
    <text x="404" y="242" font-size="25" fill="#ece3dc">One install, whole networks on the NPU.</text>
    <text x="404" y="290" font-size="16" fill="#9a8b80">YOLOv8 · YOLO11 · YOLO26 · pose · super-resolution · Windows 11 · AMD Phoenix</text>
  </g>
</svg>
