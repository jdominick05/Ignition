[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ignition-ai"
version = "0.2.0"
description = "High-performance ergonomic inference engine for AMD Ryzen AI XDNA1 NPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Ignition AI Team"}
]
keywords = ["npu", "amd", "ryzen-ai", "xdna1", "aie2", "onnx", "deep-learning", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "pillow>=9.0.0",
    "opencv-python>=4.7.0",
    "click>=8.0.0",
    "ignite-xdna>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ignition = "ignition.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ignition.assets" = ["*.xclbin", "*.bin"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_ignition_api.py",
    "tests/test_async_pipeline.py",
]

