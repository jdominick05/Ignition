# README checks. The README holds at most 250 words of prose; measurements live in docs/PERFORMANCE.md. The number
# badges are img.shields.io regex badges that read docs/PERFORMANCE.md on main, so a push that changes a number updates
# its badge by itself. This workflow publishes nothing: it fails when the README grows past its word budget, or when an
# edit would leave a badge reading "no result", or reading a number other than the one its section states.
name: README checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README stays within 250 words of prose
        run: python .github/checks/readme_words.py
      - name: Install RE2, the regex engine img.shields.io runs
        run: python -m pip install google-re2==1.1.20251105
      - name: Badge block matches badges.toml and every pattern finds one number in its section
        run: python .github/badges/badges.py check --require-re2
      - name: img.shields.io renders every number badge at this commit
        if: github.event_name == 'push'
        run: python .github/badges/badges.py live --ref "${{ github.sha }}"
