# README badges. Edit this file, then run `python .github/badges/badges.py write` to regenerate the block between the
# badges markers in README.md; `python .github/badges/badges.py check` verifies it, and so does the README checks
# workflow on every push.
#
# A badge with `search` is a dynamic img.shields.io badge. Each time it is fetched, img.shields.io runs `search` (RE2)
# over `file` (README.md unless set) on `branch` and renders `replace`, where $1, $2, ... are the pattern's groups. Its
# number is the one that file's own table states, so a push to GitHub that changes that number changes the badge, once
# img.shields.io's 2-minute and GitHub's 5-minute caches expire (their Cache-Control on 2026-09-15). `section` is the
# heading in `file` the match must stay inside, and the badge links there. `check` fails unless the pattern matches
# exactly once there with the same groups under Python's re and RE2, so an edit that would leave a badge reading
# "no result", or reading another row's number, fails the check instead. Keep label, search and replace ASCII, and use
# only $1, $2, ... in replace.
#
# Every number badge compares Ignition with AMD's stack: a number without an AMD counterpart is measured, not shown
# alone. A badge with `message` is static; one with `image` uses that image URL as it is. `row` groups badges into lines.
#
# Only one badge per model type: different scale variants of the same model type (e.g. YOLOv8m and YOLOv8s) do not
# both need badges in the README, even if both are recorded in docs/PERFORMANCE.md. Different model types/tasks (e.g.
# YOLOv8 detect vs YOLOv8-pose) count as different models. Continue to record all variants' performance in
# docs/PERFORMANCE.md, but keep the README badges minimal and uncrowded.

repository = "jdominick05/Ignition"
branch = "main"
readme = "README.md"
[[badge]]
row = 1
alt = "NPU: AMD Phoenix XDNA1"
label = "NPU"
message = "AMD Phoenix XDNA1"
color = "ed1c24"
[[badge]]
row = 1
alt = "Latest release"
image = "https://img.shields.io/github/v/release/jdominick05/Ignition"
link = "https://github.com/jdominick05/Ignition/releases/latest"
[[badge]]
row = 1
alt = "Verified on Ryzen 7 8700G"
label = "verified"
message = "Ryzen 7 8700G"
color = "blue"
[[badge]]
row = 1
alt = "License: AGPL-3.0-or-later"
label = "license"
message = "AGPL-3.0-or-later"
color = "blue"
[[badge]]
row = 2
alt = "YOLOv8n latency and COCO box accuracy against AMD's stack, both runs"
label = "YOLOv8n"
file = "docs/PERFORMANCE.md"
section = "Ignition vs AMD's Ryzen AI stack"
search = '''## Ignition vs AMD's Ryzen AI stack(?s:.*?)\*\*Against AMD's stack: ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+) (?:OKS )?mAP@50-95, against ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+)\.\*\*'''
replace = "$1 / $2 ms, $3 mAP vs AMD $4 / $5 ms, $6 mAP"
color = "brightgreen"
[[badge]]
row = 2
alt = "YOLO11n latency and COCO box accuracy against AMD's stack, both runs"
label = "YOLO11n"
file = "docs/PERFORMANCE.md"
section = "YOLO11n with its attention block"
search = '''## YOLO11n with its attention block(?s:.*?)\*\*Against AMD's stack: ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+) (?:OKS )?mAP@50-95, against ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+)\.\*\*'''
replace = "$1 / $2 ms, $3 mAP vs AMD $4 / $5 ms, $6 mAP"
color = "brightgreen"
[[badge]]
row = 2
alt = "YOLO26n latency and COCO box accuracy against AMD's stack, both runs"
label = "YOLO26n"
file = "docs/PERFORMANCE.md"
section = "YOLO26n with its DFL-free head"
search = '''## YOLO26n with its DFL-free head(?s:.*?)\*\*Against AMD's stack: ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+) (?:OKS )?mAP@50-95, against ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+)\.\*\*'''
replace = "$1 / $2 ms, $3 mAP vs AMD $4 / $5 ms, $6 mAP"
color = "brightgreen"
[[badge]]
row = 2
alt = "YOLOv8n-pose latency and COCO keypoint accuracy against AMD's stack, both runs"
label = "YOLOv8n-pose"
file = "docs/PERFORMANCE.md"
section = "YOLOv8n-pose on the NPU"
search = '''## YOLOv8n-pose on the NPU(?s:.*?)\*\*Against AMD's stack: ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+) (?:OKS )?mAP@50-95, against ([0-9.]+) / ([0-9.]+) ms and ([0-9.]+)\.\*\*'''
replace = "$1 / $2 ms, $3 OKS mAP vs AMD $4 / $5 ms, $6 OKS mAP"
color = "brightgreen"
[[badge]]
row = 2
alt = "SESR M7 super-resolution latency per frame through Ignition and AMD's stack, both runs; AMD's stack is faster"
label = "SESR M7 per frame"
file = "docs/PERFORMANCE.md"
section = "YOLOv8s and SESR M7 against AMD's stack"
search = '\| 5 \| AMD[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 6 \| Ignition[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 7 \| AMD[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 8 \| Ignition[^|]*\| SESR M7 \| \**([0-9.]+) ms'
replace = "$2 / $4 ms vs AMD $1 / $3 ms"
color = "orange"
[[badge]]
row = 2
alt = "ResNet50 classification head latency per frame on the NPU through the engine and AMD's stack, both runs; AMD's stack crashes trying to place it on the NPU"
label = "classification head"
file = "docs/PERFORMANCE.md"
section = "Classification head against AMD's stack"
search = '\| 1 \| AMD[^|]*\| ResNet50 head, NPU \| \**([a-z]+)\**(?s:.*?)\| 3 \| Ignition[^|]*\| ResNet50 head, NPU \| \**([0-9.]+) ms(?s:.*?)\| 5 \| Ignition[^|]*\| ResNet50 head, NPU \| \**([0-9.]+) ms'
replace = "$2 / $3 ms vs AMD $1"
color = "brightgreen"
[[badge]]
row = 2
alt = "Resident memory through Ignition and AMD's stack, both runs"
label = "memory (RSS)"
file = "docs/PERFORMANCE.md"
section = "Ignition vs AMD's Ryzen AI stack"
search = '\| \**Process memory \(RSS\)\** \| \**([0-9.]+) / ([0-9.]+) MB\** \| \**([0-9.]+) / ([0-9.]+) MB'
replace = "$1 / $2 MB vs AMD $3 / $4 MB"
color = "blue"
[[badge]]
row = 2
alt = "Runtime install size on disk, Ignition and AMD's stack"
label = "runtime install"
file = "docs/PERFORMANCE.md"
section = "Ignition vs AMD's Ryzen AI stack"
search = '\| \**Runtime install on disk\** \| \**([^0-9| *]*)([0-9,]+) MB\** \| \**([^0-9| *]*)([0-9,]+) MB'
replace = "$1$2 MB vs AMD $3$4 MB"
color = "blue"
[[badge]]
row = 2
alt = "YOLO11n energy per frame at full speed, Ignition's default balanced power mode and AMD's stack, both runs"
label = "YOLO11n energy per frame"
file = "docs/PERFORMANCE.md"
section = "Energy per frame against AMD's stack"
search = '\| YOLO11n \| AMD[^|]*\|[^|]*\|[^|]*\| \**([0-9.,]+) / ([0-9.,]+) mJ(?s:.*?)\| YOLO11n \| Ignition[^|]*\| balanced \|[^|]*\| \**([0-9.,]+) / ([0-9.,]+) mJ'
replace = "$3 / $4 mJ vs AMD $1 / $2 mJ"
color = "brightgreen"
[[badge]]
row = 2
alt = "YOLOv8n energy per frame at 30 frames per second, Ignition's default balanced power mode and AMD's stack, both runs"
label = "YOLOv8n energy at 30 fps"
file = "docs/PERFORMANCE.md"
section = "Energy per frame against AMD's stack"
search = '\| 1 \| AMD[^|]*\|[^|]*\| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 3 \| Ignition[^|]*\| balanced \| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 5 \| AMD[^|]*\|[^|]*\| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 7 \| Ignition[^|]*\| balanced \| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ'
replace = "$2 / $4 mJ vs AMD $1 / $3 mJ"
color = "brightgreen"
