# README badges. Edit this file, then run `python .github/badges/badges.py write` to regenerate the block between the
# badges markers in README.md; `python .github/badges/badges.py check` verifies it, and so does the README checks
# workflow on every push.
#
# A badge with `search` is a dynamic img.shields.io badge. Each time it is fetched, img.shields.io runs `search` (RE2)
# over `file` (README.md unless set) on `branch` and renders `replace`, where $1, $2, ... are the pattern's groups. Its
# number is the one that file's own table states, so a push to GitHub that changes that number changes the badge, once
# img.shields.io's 2-minute and GitHub's 5-minute caches expire (their Cache-Control on 2026-09-15). `section` is the
# heading in `file` the match must stay inside, and the badge links there. `check` fails unless the pattern matches
# exactly once there with the same groups under Python's re and RE2, so an edit that would leave a badge reading
# "no result", or reading another row's number, fails the check instead. Keep label, search and replace ASCII, and use
# only $1, $2, ... in replace.
#
# Every number badge compares Ignition with AMD's stack: a number without an AMD counterpart is measured, not shown
# alone. A badge with `message` is static; one with `image` uses that image URL as it is. `row` groups badges into lines.

repository = "jdominick05/Ignition"
branch = "main"
readme = "README.md"

[[badge]]
row = 1
alt = "NPU: AMD Phoenix XDNA1"
label = "NPU"
message = "AMD Phoenix XDNA1"
color = "ed1c24"

[[badge]]
row = 1
alt = "Latest release"
image = "https://img.shields.io/github/v/release/jdominick05/Ignition"
link = "https://github.com/jdominick05/Ignition/releases/latest"

[[badge]]
row = 1
alt = "Verified on Ryzen 7 8700G"
label = "verified"
message = "Ryzen 7 8700G"
color = "blue"

[[badge]]
row = 1
alt = "License: AGPL-3.0-or-later"
label = "license"
message = "AGPL-3.0-or-later"
color = "blue"

[[badge]]
row = 2
alt = "YOLOv8n end-to-end latency per frame through Ignition and AMD's stack, both runs"
label = "YOLOv8n per frame"
file = "docs/PERFORMANCE.md"
section = "Ignition vs AMD's Ryzen AI stack"
search = '\| \**End-to-end latency, mean\** \| \**([0-9.]+) / ([0-9.]+) ms\** \| \**([0-9.]+) / ([0-9.]+) ms'
replace = "$1 / $2 ms vs AMD $3 / $4 ms"
color = "brightgreen"

[[badge]]
row = 2
alt = "YOLO11n latency per frame through Ignition and AMD's stack, both runs"
label = "YOLO11n per frame"
file = "docs/PERFORMANCE.md"
section = "YOLO11n with its attention block"
search = '## YOLO11n with its attention block(?s:.*?)\| 1 \| AMD[^|]*\| \**([0-9.]+) ms(?s:.*?)\| 3 \| Ignition, attention core on the CPU \| \**([0-9.]+) ms(?s:.*?)\| 4 \| AMD[^|]*\| \**([0-9.]+) ms(?s:.*?)\| 6 \| Ignition, attention core on the CPU \| \**([0-9.]+) ms'
replace = "$2 / $4 ms vs AMD $1 / $3 ms"
color = "brightgreen"

[[badge]]
row = 2
alt = "YOLOv8n-pose latency per frame through Ignition and AMD's stack, both runs"
label = "YOLOv8n-pose per frame"
file = "docs/PERFORMANCE.md"
section = "YOLOv8n-pose on the NPU"
search = '## YOLOv8n-pose on the NPU(?s:.*?)\| 1 \| AMD[^|]*\| \**([0-9.]+) ms(?s:.*?)\| 3 \| Ignition on the container \| \**([0-9.]+) ms(?s:.*?)\| 4 \| AMD[^|]*\| \**([0-9.]+) ms(?s:.*?)\| 6 \| Ignition on the container \| \**([0-9.]+) ms'
replace = "$2 / $4 ms vs AMD $1 / $3 ms"
color = "brightgreen"

[[badge]]
row = 2
alt = "YOLOv8n-pose keypoint accuracy on COCO val2017, the container and AMD's stack on the same input"
label = "YOLOv8n-pose COCO keypoints"
file = "docs/PERFORMANCE.md"
section = "YOLOv8n-pose on the NPU"
search = "its detections were byte-identical to ONNX Runtime's CPU provider's \\(([0-9.]+)\\); AMD's stack was recorded at ([0-9.]+) on that input"
replace = "$1 vs AMD $2 OKS mAP@50-95"
color = "blue"

[[badge]]
row = 2
alt = "YOLOv8s latency per frame through Ignition and AMD's stack, both runs; AMD's stack is faster"
label = "YOLOv8s per frame"
file = "docs/PERFORMANCE.md"
section = "YOLOv8s and SESR M7 against AMD's stack"
search = '\| 1 \| AMD[^|]*\| YOLOv8s \| \**([0-9.]+) ms(?s:.*?)\| 2 \| Ignition[^|]*\| YOLOv8s \| \**([0-9.]+) ms(?s:.*?)\| 3 \| AMD[^|]*\| YOLOv8s \| \**([0-9.]+) ms(?s:.*?)\| 4 \| Ignition[^|]*\| YOLOv8s \| \**([0-9.]+) ms'
replace = "$2 / $4 ms vs AMD $1 / $3 ms"
color = "orange"

[[badge]]
row = 2
alt = "SESR M7 super-resolution latency per frame through Ignition and AMD's stack, both runs; AMD's stack is faster"
label = "SESR M7 per frame"
file = "docs/PERFORMANCE.md"
section = "YOLOv8s and SESR M7 against AMD's stack"
search = '\| 5 \| AMD[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 6 \| Ignition[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 7 \| AMD[^|]*\| SESR M7 \| \**([0-9.]+) ms(?s:.*?)\| 8 \| Ignition[^|]*\| SESR M7 \| \**([0-9.]+) ms'
replace = "$2 / $4 ms vs AMD $1 / $3 ms"
color = "orange"

[[badge]]
