color = "blue"

[[badge]]
row = 2
alt = "YOLOv8n energy per frame at 30 frames per second, Ignition's default balanced power mode and AMD's stack, both runs"
label = "YOLOv8n energy at 30 fps"
file = "docs/PERFORMANCE.md"
section = "Energy per frame against AMD's stack"
search = '\| 1 \| AMD[^|]*\|[^|]*\| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 3 \| Ignition[^|]*\| balanced \| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 5 \| AMD[^|]*\|[^|]*\| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ(?s:.*?)\| 7 \| Ignition[^|]*\| balanced \| [0-9.]+ ms \| [0-9.]+ % \| [0-9.]+ W \| \**([0-9.,]+) mJ'
replace = "$2 / $4 mJ vs AMD $1 / $3 mJ"
color = "brightgreen"
